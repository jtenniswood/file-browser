services:
  files:
    image: ${FILES_IMAGE:-ghcr.io/jtenniswood/file-browser:latest}
    init: true
    restart: unless-stopped
    user: '${FILES_UID:-1000}:${FILES_GID:-1000}'
    ports:
      - '127.0.0.1:${FILES_PUBLISH_PORT:-8080}:8080'
    environment:
      FILES_USERNAME: ${FILES_USERNAME:-files}
      FILES_PASSWORD: ${FILES_PASSWORD:?Set FILES_PASSWORD in your shell or .env}
      FILES_MAX_UPLOAD_BYTES: ${FILES_MAX_UPLOAD_BYTES:-10737418240}
    volumes:
      - type: bind
        source: ${FILES_DIRECTORY:-./files-data}
        target: /data
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
