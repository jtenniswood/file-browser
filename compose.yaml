services:
  files:
    image: ${FILES_IMAGE:-ghcr.io/jtenniswood/files:latest}
    init: true
    restart: unless-stopped
    user: '${FILES_UID:-1000}:${FILES_GID:-1000}'
    ports:
      - target: 8080
        published: '${FILES_PUBLISH_PORT:-8080}'
        host_ip: ${FILES_BIND_ADDRESS:-127.0.0.1}
    environment:
      FILES_BIND_ADDRESS: ${FILES_BIND_ADDRESS:-127.0.0.1}
      FILES_MOUNT_POINTS: '${FILES_MOUNT_POINTS:-[]}'
      FILES_PUBLIC_ORIGIN: ${FILES_PUBLIC_ORIGIN:-}
      FILES_MAX_UPLOAD_BYTES: ${FILES_MAX_UPLOAD_BYTES:-10737418240}
    volumes:
      - type: bind
        source: ${FILES_DIRECTORY:-./files-data}
        target: /data
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
